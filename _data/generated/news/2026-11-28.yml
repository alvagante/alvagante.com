  - title: As Corporate Bond Markets Grow, Is Bank Lending Shrinking?
    url: https://libertystreeteconomics.newyorkfed.org/2026/11/as-corporate-bond-markets-grow-is-bank-lending-shrinking/
    source: Liberty Street Economics
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=libertystreeteconomics.newyorkfed.org
    image: https://www.google.com/s2/favicons?sz=64&domain=libertystreeteconomics.newyorkfed.org
    summary: The size of global corporate bond markets has increased dramatically
      over the past three decades. As of the end of 2024, nonfinancial corporate
      bonds issued by U.S. firms accounted for 29 percent of U.S. GDP. In other
      advanced economies, though bond markets remain smaller than in the U.S.,
      corporate bonds were on average 11 percent of GDP in the same year. This
      growth is usually read as a shift from bank to market finance. But the
      ratio of bonds to GDP can rise either because firms take more debt in
      general, or because firms shift the composition of their debt toward
      bonds. In this post, we document growth in bonds to GDP for both the U.S.
      and other advanced economies, and argue that the sources of that growth
      are different across countries and have changed over time.
    category: Economy
