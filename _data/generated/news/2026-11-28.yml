  - title: America's new bargain hunt
    url: https://www.axios.com/2026/11/27/consumer-spending-cheap-retail
    source: Axios
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=axios.com
    image: https://images.axios.com/LuTgU1a-uDRqED3S06t0K7Wh6JI=/0x0:1920x1080/1366x768/2026/05/21/1779379718248.jpeg
    summary: "Americans are getting choosier about how they spend their money, with
      new signs of a nationwide bargain hunt. Why it matters: Consumer spending
      has remained resilient, helping power eye-popping economic growth. But a
      closer look at spending patterns suggests that households are trading
      down, hunting for deals and second-guessing discretionary purchases. What
      they're saying: \"Busy families are watching their budgets and being
      thoughtful about where they spend,\" Target CEO Michael Fiddelke said last
      week. Kohl's CFO Jill Timm said earlier this week that higher-income
      consumers are trading down to its stores, while middle-income shoppers are
      choosing its cheaper in-house brands. Customers bought more items per
      transaction but paid less per item, she said. Discount grocer Grocery
      Outlet saw signs for the first time last quarter of shoppers trading down
      from pricier products, particularly premium beef, CEO Jason Potter said.
      The big picture: Households this year have faced a fresh erosion of
      purchasing power after years of adjusting to a higher cost of living. That
      makes sustaining the same level of consumption increasingly dependent on
      finding cheaper alternatives. The hunt for cheaper alternatives may help
      explain why Americans are still spending at a healthy clip even as their
      frustration with prices deepens. By the numbers: Americans' spending is
      tilted toward cheaper retailers more than at any point since 2021,
      according to the latest Bank of America Institute analysis of its
      customers' card spending and deposit account data. It \"suggests consumers
      are becoming more price sensitive,\" BofA economists wrote. \"While
      households continue to spend, they are increasingly seeking discounts as
      concerns about higher prices persist.\" The bank says travel is the
      exception, with spending shifting toward pricier options. (Though it warns
      that may reflect some Americans forgoing trips altogether — leaving
      wealthier travelers to account for a greater share of spending.) Zoom in:
      Separate card spending data from Navy Federal Credit Union shows Americans
      across income groups are shifting toward discount grocers and warehouse
      stores and spending less at restaurants. Households are spending $167 more
      per month on housing, household bills and gasoline than they did in the
      same period a year ago — leaving less room in their budgets for other
      purchases. What to watch: Nearly three-quarters of holiday shoppers are
      holding off on purchases until Black Friday or Cyber Monday in hopes of
      better deals, according to Deloitte. A record share plan to shop during
      the promotional period, yet expected spending ($624 on average) is
      unchanged from last year. The bottom line: U.S. consumers' ability to keep
      spending may depend on how much further they can stretch each dollar."
