      sentences for sharing photos and videos of Ukrainian attacks"
    url: https://meduza.io/en/feature/2026/11/27/no-reports-no-strikes-russia-s-pro-war-bloggers-slam-proposed-prison-sentences-for-sharing-photos-and-videos-of-ukrainian-attacks
    source: Meduza — English
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=meduza.io
    image: https://meduza.io/image/attachments/images/013/024/636/small/ppdryll6EJ-rTmrsFwOBpQ
    summary: Yesterday, a group of Russian senators introduced a bill in the State
      Duma that calls for prison terms of up to five years for illegally
      distributing information about the aftermath of Ukrainian strikes, as well
      as terrorist attacks and sabotage. Bans on publishing photos and videos of
      attack aftermath are already in effect in many regions, though until now
      the punishment has only involved administrative fines. Now a new article
      could appear in the Criminal Code as well. Authors of pro-war Z-channels
      and “military correspondents” reacted to the initiative with unanimous
