  - title: CISA Adds Three Known Exploited Vulnerabilities to Catalog
    url: https://www.cisa.gov/news-events/alerts/2026/11/24/cisa-adds-three-known-exploited-vulnerabilities-catalog
    source: CISA Cybersecurity Advisories
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=cisa.gov
    image: https://www.google.com/s2/favicons?sz=64&domain=cisa.gov
    summary: "CISA has added three new vulnerabilities to its Known Exploited
      Vulnerabilities (KEV) Catalog , based on evidence of active exploitation.
      CVE-2026-131914 Idunno AntiCsrf Deserialization of Untrusted Data
      Vulnerability&nbsp; CVE-2026-132165 Drupal Core Remote Code Execution
      Vulnerability&nbsp; CVE-2026-132224 Optimizely Web Experimentation
      External Control of Critical State Data Vulnerability&nbsp; These types of
      vulnerabilities are a frequent attack vector for malicious cyber actors
      and pose significant risks to the federal enterprise. Binding Operational
      Directive (BOD) 26-04: Prioritizing Security Updates Based on Risk
      establishes vulnerability management requirements for Federal Civilian
      Executive Branch (FCEB) agencies. BOD 26-04 reinforces the importance of
      the KEV Catalog and requires federal agencies to prioritize rapid
      remediation of high-risk vulnerabilities, specifically those identified by
      Common Vulnerabilities and Exposures (CVEs) listed in CISA’s KEV Catalog
      on publicly exposed assets that grant total control of the asset
      post-exploitation, while deferring action for lower-risk vulnerabilities.
      BOD 26-04 further establishes basic expectations for when agencies must
      check whether threat actors compromised the system before the patch was
      applied. While BOD 26-04 applies only to FCEB agencies, CISA encourages
      all organizations to adopt risk-based vulnerability management and
      prioritize remediation of KEV Catalog vulnerabilities . CISA will continue
      to add vulnerabilities to the catalog that meet the specified criteria .
      Aware of an exploited vulnerability not currently listed in the KEV
      Catalog? Submit it for potential addition through CISA’s KEV Nomination
      Form . Potential KEV additions must have a CVE ID, evidence of
      exploitation, and clear mitigation guidance."
