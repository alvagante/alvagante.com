  - title: Dark fantasy and sudoku fuse together in unholy matrimony in Dungoku, a
      dungeon crawling twist on the classic puzzle game
    url: https://www.rockpapershotgun.com/dark-fantasy-and-sudoku-fuse-together-in-unholy-matrimony-in-dungoku-a-dungeon-crawling-twist-on-the-classic-puzzle-game
    source: Rock Paper Shotgun
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=rockpapershotgun.com
    image: https://assetsio.gnwcdn.com/dungoku.jpg?width=690&quality=85&format=jpg&auto=webp
    summary: Maths is not my strong suit, I make no secret of this, so when I come
      face to face with something like sudoku I will admit to recoiling in fear
      at having to confront this issue. Numbers don't make sense to me at the
      best of times, and now I have to figure out the specific placements of
