  - title: Does the Stock Market Stigmatize Banks that Borrow from the Fed?
    url: https://libertystreeteconomics.newyorkfed.org/2026/11/does-the-stock-market-stigmatize-banks-that-borrow-from-the-fed/
    source: Liberty Street Economics
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=libertystreeteconomics.newyorkfed.org
    image: https://www.google.com/s2/favicons?sz=64&domain=libertystreeteconomics.newyorkfed.org
    summary: Banks may resist borrowing from the Federal Reserve during a panic if
      such borrowing is stigmatized (that is, viewed by the market as a sign of
      financial weakness), thus hampering the Fed’s ability to resolve the
      crisis. The problem may be particularly acute for publicly traded banks
      since their stock prices immediately reflect the market's opinion of them.
      In this post, based on a recent paper , we track what happened to stock
      investors' perceptions of a bank's risk level right after it first
      borrowed from Fed facilities in the first month of the bank run of 2023 .
      We find that, after a first trip to the Fed's Discount Window (DW),
      investors became more sensitive to that bank's weaknesses. In contrast,
      investors did not evince such concern when the bank took a first loan from
      a new facility, the Bank Term Funding Program (BTFP).
    category: Economy
    tags:
