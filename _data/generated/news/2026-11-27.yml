  - title: Five Facts About Stablecoins -- by Lin William Cong, Gordon Y. Liao,
      Eswar S. Prasad, Tony Zhang
    url: https://www.nber.org/papers/w36038#fromrss
    source: NBER New Working Papers
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=nber.org
    image: https://www.google.com/s2/favicons?sz=64&domain=nber.org
    summary: "We document five facts about payment stablecoins using wallet-level
      blockchain data from 2020 to 2025. First, stablecoins serve as a
      transaction currency: onchain volume exceeds Bitcoin’s despite a much
      smaller supply, velocity has risen sharply, and transactions have shifted
      toward low-value transfers. Second, using transaction timing to refine
      exchange-based attribution, we find activity spread across the Americas,
      Europe, and Asia and fewer cross-regional flows than the standard method
      implies. Third, we estimate a structural cash-management model on the
      holdings data and find that the costs of accessing stablecoin wallets have
      fallen since 2023. Fourth, stablecoins are becoming the settlement
      currency of a fast-growing onchain credit market, and their growth appears
      to reallocate rather than destroy credit. Fifth, smart contracts are
      involved in about a third of Ethereum stablecoin transactions and over two
      thirds of volume, and protocols such as x402 demonstrate sub-cent
      machine-to-machine payments. Stablecoins behave as tokenized money, with
      implications for financial markets and regulation."
