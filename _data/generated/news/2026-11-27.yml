  - title: "Designing Low Emission Zones: Theory and Evidence -- by Nano Barahona,
      Natalia Fabra, Imelda, Juan-Pablo Montero"
    url: https://www.nber.org/papers/w36037#fromrss
    source: NBER New Working Papers
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=nber.org
    image: https://www.google.com/s2/favicons?sz=64&domain=nber.org
    summary: "Low Emission Zones (LEZs), which exclude polluting vehicles from parts
      of a city, are spreading. Yet how their design affects welfare is poorly
      understood. Unlike price instruments, LEZs ration access inefficiently,
      imposing costs on inframarginal drivers of restricted vehicles. In our
      model, welfare is quasi-convex in LEZ size, yielding bang-bang principles:
      LEZs should be as large as possible or not implemented at all; cleaner
      vehicles (e.g., hybrids) could be exempt as transition technologies but
      later restricted, which may require planner commitment. Using new-car
      purchases, we find Madrid’s LEZ shifted buyers toward cleaner cars, but
      the surplus losses of switchers and inframarginal drivers exceeded
      emission savings."
    category: Economy
    tags:
      - economy
      - research
      - working-papers
