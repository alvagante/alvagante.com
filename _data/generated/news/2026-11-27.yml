      overflow, and/or stack-based buffer overflow, which could result in local
      attackers being able to exploit these issues to potentially execute
      arbitrary code. The following versions of Schneider Electric EcoStruxure
      Power Build Rapsody software are affected: EcoStruxure Power Build Rapsody
