  - title: "Democratizing Venture Capital: Tax Incentives and the Geographic
      Expansion of Startup Investing -- by Murillo Campello, Guilherme
      Junqueira"
    url: https://www.nber.org/papers/w36039#fromrss
    source: NBER New Working Papers
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=nber.org
    image: https://www.google.com/s2/favicons?sz=64&domain=nber.org
    summary: Can tax subsidies expand the geographic reach of startup investing?
      Despite decades of growth, venture capital (VC) remains concentrated in a
      handful of metropolitan areas, leaving most of the country with limited
      access to startup financing. We study the 2009–2010 enhancement of the
      Qualified Small Business Stock (QSBS) program, which eliminated federal
      capital gains taxes on investments in qualifying startups. By raising the
      payoff to success, the reform made riskier investments more attractive,
      including entry into unfamiliar markets. This incentive is especially
      strong for VC funds. Relative to similarly sized metros that already had
      VC, the reform raised the probability that a previously unserved metro
      received VC investment in qualifying sectors by 8 to 10 percentage points.
      There was no comparable increase in sectors excluded from QSBS or among
      angel investors, who receive the same tax benefit. Startups in newly
      served markets performed like those in other non-hub markets, created
      high-wage jobs, and attracted scientific and technical workers, some from
      established hubs. Our findings suggest that a sufficiently large subsidy
      can extend VC into markets it had long bypassed, even with no requirement
      on where startups are located.
    category: Economy
    tags:
