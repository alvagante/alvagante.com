  - title: The Emergence of a National Capital Market,1870–1940 -- by Pawel Janas
    url: https://www.nber.org/papers/w36040#fromrss
    source: NBER New Working Papers
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=nber.org
    image: https://www.google.com/s2/favicons?sz=64&domain=nber.org
    summary: "This article documents the integration of the American capital market
      with the first long-run, geolocated, firm-level record of the asset
      holdings of large institutional investors: over 100,000 holdings of life
      insurers, 1870–1940. Between 1880 and 1890 the mean distance of insurers’
      bonds from home more than doubled and their home-state share fell from
      over half to under a quarter. The shift occurred within firms, across bond
      classes and charters. Mortgage lending was national wherever state law
      permitted it. Integration was largely complete by 1890."
