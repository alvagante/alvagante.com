  - title: Does Treating Addiction Rebuild Lives? Evidence from Buprenorphine -- by
      Sarah Eichmeyer, Aljoscha Janssen, Jonathan Zhang
    url: https://www.nber.org/papers/w36041#fromrss
    source: NBER New Working Papers
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=nber.org
    image: https://www.google.com/s2/favicons?sz=64&domain=nber.org
    summary: Does treating addiction improve economic circumstances as well as
      health? Using two decades of Veterans Health Administration records on
      over 140,000 patients with opioid use disorder and consumer credit data,
      we exploit staggered facility-level buprenorphine adoption and
      quasi-random emergency physician assignment. A five-percentage-point
      increase in the share of clinicians with buprenorphine prescribing
      experience doubles overdose survivors’ long-term medication use and
      reduces two-year mortality by an estimated 3.7 percentage points.
      Instrumenting receipt yields a 22 percent credit score gain. At $300,000
      per statistical life-year, estimated survival benefits alone exceed added
      medical costs within three years
