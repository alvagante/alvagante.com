  - title: "Data + AI Anywhere: AlloyDB Omni integration with local models"
    url: https://cloud.google.com/blog/products/databases/alloydb-omni-integration-with-local-models/
    source: Google Cloud Blog
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=cloud.google.com
    image: https://www.google.com/s2/favicons?sz=64&domain=cloud.google.com
    summary: 'Open models like Gemma 4 from Google DeepMind are a great option to
      keep your data local. But how can a local AI model integrate with
      on-premises data? AlloyDB Omni , Google’s 100% PostgreSQL-compatible
      database that runs anywhere, now integrates with locally hosted large
      language models (LLMs). With AlloyDB Omni, you can build agentic
      experiences on your own infrastructure and on your own terms. Whether it’s
      in the cloud, in your datacenter, or even on your laptop, you can have
      data plus AI anywhere. Built-in AI for your local environment AlloyDB Omni
      is a downloadable, run-anywhere edition of AlloyDB that easily deploys to
      your own infrastructure, including on-premises. AlloyDB Omni packs
      powerful, built-in AI, including the same ScaNN indexing technology
      powering Google Search. When you pair AlloyDB Omni with a model, you can
      store vector embeddings at scale; search them semantically; and even query
      the database using natural language. You can use virtually any model you
      like, whether that’s a frontier Cloud-hosted model like Gemini or a local
      model. And with locally hosted models you maintain complete control over
      your data environment. Connecting to Gemma 4, Qwen3.8, and other local
      models You can now connect AlloyDB Omni to local models like Gemma 4 and
      Qwen3.8 . No matter which model you choose, the architecture remains the
      same. AlloyDB Omni calls a local model server directly from SQL — keeping
      prompts, data, and responses inside your environment. This setup enables
      entirely new use cases for environments that were previously blocked from
      adopting agentic capabilities. If you operate an air-gapped network or
      have data locality requirements, you can still build intelligent
      applications. You can analyze local logs, generate summaries of
      proprietary internal documents, and power localized chatbots—all while
      maintaining strict data governance. Keep data on-premises: Because the
      database and the model sit in the same local environment, your data never
      crosses the public internet. Reduce latency: Processing inference requests
      locally minimizes network transit time. Query directly via SQL: Your
      standard database queries can invoke machine learning functions that
      process data locally. Like this: code_block &#x27;gemma4_llm&#x27;) AS
      summary\r\nFROM customer_feedback;\r\n\r\n customer_name | summary
      \r\n---------------+-----------------------------------------------------------------------\r\n
      Alice | The customer demands a refund for a double charge or they will
      cancel\r\n Bob | The user likes the product but requests dark mode
      support."), (&#x27;language&#x27;, &#x27;&#x27;), (&#x27;caption&#x27;,
