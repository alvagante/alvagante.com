  - title: Scaling Laws, Carefully
    url: https://lilianweng.github.io/posts/2026-06-24-scaling-laws/
    source: Lilian Weng's Blog
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=lilianweng.github.io
    image: https://www.google.com/s2/favicons?sz=64&domain=lilianweng.github.io
    summary: "Scaling laws are one of the most critical empirical findings in deep
      learning. The observation is simple in form: the training loss $L$
      decreases predictably as we scale up model size $N$, dataset size $D$, and
      compute $C$, following a power-law curve, which appears as a straight line
      on a log-log plot. We can view scaling laws as a framework for describing
      the relationship between compute, loss, model size and data; at its core,
      it is about how to allocate precious compute optimally between $N$ and
      $D$."
