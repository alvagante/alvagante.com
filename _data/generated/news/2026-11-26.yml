  - title: Prenatal developmental toxicity of the 70% ethanolic extract of defatted
      Lepidium sativum L . seeds in Wistar rats
    url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0363832
    source: PLOS ONE
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=plos.org
    image: https://www.google.com/s2/favicons?sz=64&domain=plos.org
    summary: "by Teshome Gebremeskel Aragie, Kaleab Asres, Wondwosen Ergete, Samual
      Woldekidan, Abiy Abebe, Bihonegn Sisay, Girma Seyoum Introduction Lepidium
      sativum Linn. seeds are widely consumed for medicinal and nutritional
      purposes, including among pregnant women; however, its safety profile
      during gestation remains inadequately defined. Therefore, this study
      evaluated the prenatal developmental toxicity of Lepidium sativum seeds in
      rats. Methods A total of five groups of pregnant Wistar rats were employed
      to evaluate the prenatal developmental effects of Lepidium sativum seed
      extract in two independent experimental arms. Treatments were administered
      via oral gavage during critical period of organogenesis (gestational day
      12 [GD12] with the aim to evaluate the extract’s effect on embryonic
      development. In GD12 experiment, each group containing a specific number
      of rats: group I and V consisted of ten rats each, while groups II, III,
      and IV included nine rats per group. Separate cohorts were examined on
      GD20 to capture near term developmental outcomes and late-stage
      developmental effects of the extract. The number of pregnant rats
      available for GD20 subgroup was ten in groups I, IV, and V, nine in group
      II, and seven in group III respectively. In both studies, groups I- III
      served as experimental groups and were given 250 mg/kg, 500 mg/kg, and
      1000 mg/kg of the extract respectively during GD6–12. While, groups IV and
      V were pair-fed and ad libitum controls respectively. One-way ANOVA with
      Tukey’s post hoc test was used to compare the groups, and statistical
      significance was declared at p Results In the GD12 subgroup, embryos from
      1000 mg/kg of the extract exhibited significantly lower morphological
      scores in the embryonic heart ( p p = 0.002), and olfactory ( p = 0.004)
      systems. A higher incidence of stillbirths and low birthweight pups was
      observed in 1000 mg/kg treated rats of GD20. Additionally, brain
      ventricular dilation was observed in 8% of fetuses from groups treated
      with 1000 mg/kg compared to the controls ( p Conclusions Oral
      administration of Lepidium sativum seed extract during gestational day
      6–12 at 500 mg/kg and 1000 mg/kg doses was associated with significant
      developmental delays in rat embryos. The extract also resulted in a higher
      number of stillbirths, low birthweight, and developmental delays in rat
      fetuses."
    category: Science
    tags:
