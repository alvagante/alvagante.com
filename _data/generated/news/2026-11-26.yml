  - title: What Withdrawal of the UN Mission Means for Western Sahara
    url: https://www.crisisgroup.org/qna/middle-east-north-africa/western-sahara/what-withdrawal-un-mission-means-western-sahara
    source: International Crisis Group
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=crisisgroup.org
    image: https://www.google.com/s2/favicons?sz=64&domain=crisisgroup.org
    summary: "What Withdrawal of the UN Mission Means for Western Sahara pfranz Fri,
      11/20/2026 - 18:44 Latest Updates Africa Asia-Pacific Europe Latin America
      & Caribbean Middle East & North Africa United States Global Issues &
      Institutions My Reading List A United Nations Mission for the Referendum
      in Western Sahara (MINURSO) Mil Mi-8 helicopter lands on the Moroccan side
      of the border crossing point between Morocco and Mauritania in Guerguerat
      located in the Western Sahara, on November 25, 2020. Fadel SENNA / AFP Q&A
      / Middle East & North Africa 20 November 2026 14 minutes What Withdrawal
      of the UN Mission Means for Western Sahara The 35-year-old MINURSO
      peacekeeping mission in Western Sahara is no more, raising several
      questions about the future of this disputed territory. In this Q&A, Crisis
      Group experts Riccardo Fabiani and Mariea Sekijima look at some of the
      most pressing concerns.&nbsp; Share BlueSky Email Facebook Linkedin
      Twitter Whatsapp Save Print Related Tags Western Sahara Morocco Mauritania
      What happened? On 30 October, the UN Security Council failed to renew the
      mandate of MINURSO, the contingent of UN peacekeepers in Western Sahara,
      putting an end to a mission that began in 1991. MINURSO was first deployed
      some 35 years ago with a dual purpose: first, to safeguard a truce between
      Morocco, which lays claim to Western Sahara, and the pro-independence
      Polisario Front; and secondly, to oversee a referendum on
      self-determination for the territory that the two parties had agreed to
      hold as part of the ceasefire deal. It succeeded to a great extent in the
      first task, with no serious hostilities between the parties until 2020,
      when Morocco took over part of a buffer zone in Western Sahara and the
      Polisario pulled out of the ceasefire accord, and only limited fighting
      since then. But it had no power to compel progress toward the referendum –
      a vote that has never occurred, as Rabat and the Polisario have never come
      to terms on who should be able to cast a ballot. In 2007, Morocco advanced
      an autonomy plan as an alternative, which has gradually become the focus
      of international diplomacy on Western Sahara, notwithstanding objections
      from the Polisario, its primary external patron Algeria and other powers
      including Russia. MINURSO is thus departing with its objectives
      unaccomplished and the underlying conflict unresolved. Though MINURSO’s
      fate was sealed only at the end of October, its withdrawal from Western
      Sahara is already well under way. On 4 November, UN Under
      Secretary-General for Peace Operations Jean-Pierre Lacroix estimated that
      wrapping up the mission – which as of the end of October included about
      350 military and civilian personnel – will take around two months. MINURSO
      has already stopped its military monitoring in the buffer zone, which
      separates Moroccan-controlled Western Sahara from the borders with Algeria
      and Mauritania, and over the coming weeks its key facilities in that zone
      will be shut down and the staff repatriated. Between December and January,
      the remaining installations and equipment will also be closed and all the
      mission’s other obligations terminated.&nbsp; MINURSO’s end has shaken up
      a conflict that has been reasonably contained, if not dormant, for
      decades, and several dangers lie in wait when the mission is gone. One is
      that Morocco seizes the chance to expand its territorial control at the
      Polisario’s expense. Another is that the Front follows through on
      long-mooted plans to escalate its armed struggle. Either of these
      scenarios could embroil Algeria, raising the spectre of an interstate
      conflict in North Africa. MINURSO’s withdrawal will likely dim the already
      faint prospects for renewed negotiations. Importantly, however, the
      mandate of the UN Secretary-General’s personal envoy for Western Sahara,
      Staffan de Mistura, is not tied to MINURSO. His efforts to provide good
      offices on behalf of the UN leadership continue. Together with the U.S.
      and European governments, he should urge both sides to avoid provocative
      steps that might reignite this conflict. Why did the Security Council fail
      to renew the mission’s mandate? MINURSO met its demise abruptly, in the
      space of 48 hours. On 30 October, in its role as penholder on the Western
      Sahara file, the U.S. put forward a draft resolution renewing the
      mission’s mandate for a year. The text, however, diverged from previous
      resolutions in three significant respects. First, it described Morocco’s
      autonomy plan for Western Sahara as “the only basis for negotiation” and
      “the most feasible solution”, abandoning more ambiguous language that had
      featured in the 2025 resolution. Secondly, the U.S. proposed changing the
      name of the mission to “MINUSO”, thus dropping the remaining reference to
      a self-determination vote (the “R” in MINURSO stands for “referendum”).
      Thirdly, the draft encouraged the UN envoy to consult other Sahrawi
      interlocutors besides the Polisario in settling the Western Sahara
      dispute.&nbsp; Russia vetoed the U.S. draft, saying it was one-sided in
      Morocco’s favour. Russia vetoed the U.S. draft, saying it was one-sided in
      Morocco’s favour. Assisted by China, Russian diplomats tried to negotiate
      more balanced language, but the U.S. said no. At that point – hours before
      the scheduled vote – Moscow introduced an alternative draft resolution to
      renew the UN mission’s mandate by another year, but with no reference to
      Morocco’s autonomy plan. The text was not adopted, garnering support from
      only three states (China, Russia and Somalia). Likely due to signals that
      neither the U.S. nor Russia would compromise on its position, no other
      Council member proposed an alternative text. As a result, MINURSO’s
      mandate expired on 31 October.&nbsp; While MINURSO’s end was sudden, the
      clash between the U.S. and Russia on Western Sahara has been long in the
      making. For years, Russia has been registering objections to the evolution
      in the Security Council’s language as other powers began lining up behind
      Morocco’s autonomy plan. In 2018, Moscow abstained from a vote to renew
      MINURSO, arguing that the language was too accommodating of Rabat’s
      position. At the time, Russia opposed a clause referring to “the need to
      make progress toward a realistic, practicable and enduring political
      solution”, which it considered an implicit endorsement of the autonomy
      plan. Since then, Moscow has declined to vote in favour of any resolution
      the U.S. has tabled on this file, lamenting Washington’s refusal to
      incorporate suggestions for rebalancing language that, as Russian
      diplomats put it, betrays pro-Moroccan bias.&nbsp; In December 2020,
      toward the end of President Donald Trump’s first term, Washington did
      indeed take Rabat’s side in the underlying dispute. It recognised Moroccan
      sovereignty over Western Sahara as part of a trilateral agreement with
      Israel and Morocco that led to diplomatic normalisation between those two
      countries. Following the interlude of the Biden administration, which
      avoided wading into this matter, the second Trump administration has
      pushed the UN Security Council to adopt an increasingly pro-Moroccan
      stance on the conflict. In 2025, when MINURSO’s mandate was up for
      renewal, the U.S. sought to anchor negotiations in the autonomy plan,
      calling it “the basis” for future negotiations and “the most feasible
      outcome”. Pushback from Russia and other Council members forced a partial
      retreat, with the final text describing autonomy merely “as basis” for
      talks and “a most feasible” outcome, even though Russia still saw this
      watered-down language as too biased and opted to abstain again. The
      resulting text displayed a strong preference for the Moroccan autonomy
      proposal while technically keeping other options on the table. This time
      around, the Trump administration appears to have concluded that a Russian
      veto was better than extending the status quo. Faced with a choice between
      prolonging MINURSO’s mandate without clear support for Morocco’s autonomy
      plan and precipitating the mission’s closure, Washington seemed ready to
      accept the consequences of the latter option. Concurrently, the shutdown
      enables the U.S. to reduce UN spending on peacekeeping, a priority that
      the administration has identified on many occasions. How have Morocco and
      the Polisario Front responded? Morocco has welcomed MINURSO’s drawdown,
      though it came from a veto on a draft text that was very favourable to the
      kingdom’s position. A communiqué published by the Royal Cabinet
      immediately after the Security Council vote described this decision as “a
      significant step toward the definitive closure of the Moroccan Sahara
      issue at the UN”. The same statement added that, after the vote, the
      Security Council should formally remove this issue from its agenda,
      announcing that Rabat was preparing to take other initiatives to end UN
      supervision of the conflict. Morocco also reiterated its commitment to the
      ceasefire, which is likely to mean that its forces will stay in their
      current positions, avoiding offensive action, despite the end of MINURSO’s
      monitoring. In a television interview the day after the vote, Foreign
      Minister Nasser Bourita provided more details about Morocco’s next steps.
      He said Moscow had warned Rabat of its intentions at the Security Council,
      but that Morocco “did not ask Russia to reverse its position”, since that
      would have required further diluting the draft resolution’s language along
      the lines of the concessions made the previous year. Instead, he said,
      Morocco saw an opportunity to challenge the existing UN framework. In
      Rabat’s eyes, MINURSO had become an anachronism, with reference to a
      referendum in its very name, and in any case has been ineffective in
      monitoring military activities in the buffer zone, even though its
      presence on the ground had allowed external observers to track the
      conflict’s ups and downs. Bourita added that Morocco is now set to direct
      its diplomatic efforts at the UN General Assembly’s Special Political and
      Decolonisation Committee, known as the Fourth Committee, where it will
      seek to remove Western Sahara from the UN’s list of non-self-governing
      territories. The UN’s internal workings mean that Morocco likely will not
      be able to make such an effort until the General Assembly’s next session
      in September 2027. Morocco’s intentions are to close the Western Sahara
      question, both at the UN and in courts of law, once and for all. Morocco’s
      intentions are to close the Western Sahara question, both at the UN and in
      courts of law, once and for all. While Moroccan officials have yet to
      outline exactly how they plan to do so, a Moroccan legal expert and a
      journalist speaking to Crisis Group claimed that a roadmap is already to
      hand. By its terms, authorities will seek to negotiate an agreement on
      autonomy under Moroccan sovereignty with Sahrawis willing to discuss such
      an arrangement, namely the Sahrawi Movement for Peace and Khat al-Shaheed,
      two groups founded by Polisario dissidents, as well as Sahrawi tribal
      leaders and elected representatives in the Moroccan parliament and local
      institutions in Rabat-controlled Western Sahara. The deal will then be
      submitted to a national referendum aimed at amending the constitution;
      Morocco will present its approval as evidence of the Sahrawi population’s
      act of self-determination, before demanding that the Fourth Committee
      remove Western Sahara from its list of non-self-governing territories.
      This final step is meant to undermine any legal claim that the territory
      is still not officially self-governing, blocking demands against Moroccan
      interests in courts around the world, such as the EU’s Court of Justice.
      Meanwhile, the Polisario Front applauded the Russian veto at the UN
      Security Council, as it stopped a resolution that it saw as blatantly
      partial toward Morocco. It expressed no regret or concern regarding
      MINURSO’s demise. In a statement published the day after the vote, the
      Polisario accused the U.S. of bias and warned Morocco against taking steps
      that could undermine regional peace and security.&nbsp; While the Front
      declared its readiness to keep cooperating with the UN toward a political
      solution, the likelihood of a return to negotiations under UN auspices or
      otherwise is now very low. In his television interview, Bourita said
      Morocco would return to the table only under four conditions: autonomy
      within Morocco’s borders must be the only subject of discussion; it must
      also be the endpoint of talks; Algeria and Mauritania must participate, in
      addition to the Polisario; and the negotiating framework must be clearly
      defined. This approach is wholly incompatible with the Front’s position,
      which rejects autonomy as the only basis for negotiations and emphasises
      self-determination as the desired outcome. Still another factor militating
      against talks is that the Polisario’s confidence in mediators is
      threadbare. In addition to the U.S., the Polisario has singled out de
      Mistura as being inclined in Morocco’s favour, after he, too, called
      autonomy “the basis” of future negotiations in a closed-door Security
      Council meeting. On 12 October, it sent a letter to the UN
      Secretary-General, accusing the envoy of compromising “his mandate of
      strict neutrality and his role as an impartial mediator” and threatening
      to reconsider its cooperation with him.&nbsp; Despite the difference in
      their attitudes toward the impending withdrawal, both Morocco and the
      Polisario Front are collaborating with the UN on an orderly exit for
      MINURSO. What does MINURSO’s termination mean for the conflict? MINURSO’s
      withdrawal calls into question the status of the buffer zone, as well as
      of the territory east of the sand berm, the huge earthen wall that Morocco
      erected to shield Moroccan-controlled Western Sahara from Polisario
      attack. The closure of MINURSO monitoring sites in this area removes a
      tripwire that had helped control the conflict’s intensity. After
      hostilities resumed in November 2020, the UN mission continued to monitor
      military activity, keeping up the fiction that the ceasefire was still in
      place, despite Morocco occupying a section of the buffer zone (the area
      around the Guerguerat road to Mauritania) and the Polisario having
      officially withdrawn from the ceasefire agreement. The peacekeepers’
      presence dissuaded Morocco from occupying the rest of Western Sahara in
      response to Polisario’s strikes and thus helped reduce the risk of further
      escalation. As a result, the conflict remained a low-intensity affair,
      marked by hit-and-run rocket fire by Polisario units at the sand berm and
      occasionally the city of Smara, met by retaliatory or (occasionally)
      pre-emptive drone strikes by Morocco. With MINURSO’s closure, and in spite
      of Morocco’s commitment to the ceasefire, the future of this area is now
      more uncertain. In 2022, Morocco’s ambassador to the UN, Omar Hilale,
      declared that Morocco would have the right to take over the rest of
      Western Sahara if the UN mission were to withdraw. In early November, a
      number of Moroccan military officers visited Mauritania; this development,
      in addition to an alleged trip by Bourita to the Mauritanian capital
      Nouakchott, fuelled speculation among Moroccan and Sahrawi observers that
      Rabat might be planning to occupy the buffer zone along the border with
      Mauritania. That said, a Moroccan journalist pointed out that any
      occupation of the area could undermine Moroccan interests, as it could
      attract unwanted international attention and condemnation at a time when
      Rabat wishes to build diplomatic support for its preferred outcome. These
      moves did not go unnoticed among Polisario officials and supporters. The
      Front was further alarmed by unconfirmed reports of troop and tank
      movements near the sand berm and a Moroccan drone attack that targeted two
      Mauritanian nationals who happened to be inside the buffer zone. In
      response, on 10 November the Front declared a state of general
      mobilisation to counter “escalating Moroccan military movements and
      growing threats to the security and stability of the region”. The risks
      posed by MINURSO’s imminent withdrawal should not be underestimated. For
      the moment, both sides appear to be posturing rather than gearing up for a
      confrontation, but the risks posed by MINURSO’s imminent withdrawal should
      not be underestimated. Morocco and the Polisario may have been hardening
      their stances chiefly to close their respective internal ranks ahead of
      the uncertainties that will follow the UN mission’s end. But a military
      escalation once the withdrawal is complete remains a possibility,
      especially since the UN diplomatic framework that previously regulated the
      conflict is unlikely to be resurrected. MINURSO’s departure is also likely
      to lend momentum to the Polisario’s internal debates about whether and how
      to step up its armed struggle against Morocco. In recent years, Front
      officials have publicly talked about the possibility of organising sleeper
      cells inside Moroccan-controlled Western Sahara to attack public
      buildings, consulates and even airlines. In Crisis Group interviews
      conducted in 2025, Polisario supporters pointed to drone jammers, ie,
      electronic devices that disrupt drones’ communication and satellite
      navigation signals, as a tactical game changer, though Algeria (which
      possesses this technology) so far appears to have refrained from
      transferring it to the Polisario, possibly for fear of inducing an
      escalation. That said, others were sceptical of the benefits of drone
      jammers, which the Moroccan air force could eliminate; instead, they
      advocated for acquiring, through Algeria or another supplier, a drone
      fleet that could counter Moroccan air superiority in the buffer zone and
      enable attacks deeper into areas under Moroccan control, potentially
      extending beyond Western Sahara.&nbsp; Morocco’s occupation of the buffer
      zone and the territories east of the berm, which are equivalent to roughly
      20 per cent of Western Sahara’s territory, is a real possibility. Rabat
      might calculate that a rapid offensive would stay in the news for only a
      few days, creating facts on the ground that most regional and Western
      governments would be ready to live with. Alternatively, Morocco might wait
      until a Polisario attack offers a sufficiently plausible pretext to occupy
      the buffer zone and the territories east of the berm.&nbsp; Either way,
      occupying this area would risk creating a security dilemma for Morocco,
      the Polisario and Algeria. Since 2020, the Polisario has used the buffer
      zone and the territories east of the berm to conduct raids on Moroccan
      army positions. In the event of a Moroccan takeover, the Polisario could
      decide to assail Moroccan forces directly from Algerian territory. Rabat
      would then face a difficult choice: tolerate cross-border attacks or go
      after Polisario fighters in Algeria, whether through hot pursuit or
      retaliatory strikes. Either would constitute a direct violation of
      Algerian sovereignty, potentially triggering a military response from
      Algiers. While Algerian officials have never given a clear account of how
      they would react in such circumstances, they would probably find it hard
      to justify inaction in the face of domestic public outrage. What should
      European governments, the UN and the U.S. do to reduce these risks?
      European governments, the UN and the U.S., should step up their diplomatic
      efforts to stop MINURSO’s termination from heightening tensions, let alone
      setting off broader regional strife. Avoiding clashes between Morocco and
      Algeria, which could destabilise North Africa, disrupt energy supplies to
      Europe and fuel new migration flows across the Mediterranean, ought to be
      a priority, even if the risk of an imminent conflict remains modest. These
      states and bodies should convey clear, coordinated messages to Rabat and
      Algiers that unilateral actions liable to upset the military balance must
      be avoided. In particular, they should discourage Morocco from taking over
      the buffer zone and the territories east of the berm, while warning
      Algeria not to provide the Polisario with more sophisticated weaponry that
      could intensify the fighting.&nbsp; As the remaining UN representative in
      councils about Western Sahara, de Mistura has an important role to play in
      keeping the UN at the table, even if it is unlikely that the parties will
      return to dialogue in the short term. In addition to sending coordinated
      messages to Rabat and Algiers, he should urge the Polisario leadership to
      refrain from attacks that could provoke a Moroccan military response.
      While his diminished credibility with the Polisario means that he has
      little to no power to push the Front back to the negotiating table, he can
      still use his good offices to deliver de-escalatory cautions to all
      concerned. European governments, the UN and the U.S. should also activate
      diplomatic back channels with the parties to explore ways of preserving
      the military status quo. Given the deepening mistrust between Morocco and
      the Polisario, as well as between the Polisario, on one hand, and the UN
      and U.S. on the other, a return to formal negotiations appears improbable
      in the immediate future. Nevertheless, discreet contacts could help
      clarify the parties’ intentions, establish informal understandings over
      the buffer zone and reduce the risk of miscalculation in the absence of UN
      military monitors. Related Tags More for you Commentary / Middle East &
      North Africa The U.S. and UN Will Need More Patience to Resolve Western
      Sahara Conflict Also available in Arabic Briefing / Middle East & North
      Africa A Window for Diplomacy in Western Sahara Also available in Arabic ,
      Français"
