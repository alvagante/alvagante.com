  - title: Schedule for Week of January 11, 2026
    url: http://www.blogger.com/feeds/10004977/posts/default/8392781990658012126
    source: Calculated Risk
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=calculatedriskblog.com
    image: https://www.google.com/s2/favicons?sz=64&domain=calculatedriskblog.com
    summary: "The key reports this week are December CPI, Existing Home Sales and
      November Retail Sales. Also, New Home Sales for September and October will
      be released. For manufacturing, the December Industrial Production report
      and the January New York and Philly Fed manufacturing surveys will be
      released. ----- Monday, January 12th ----- No major economic releases
      scheduled. ----- Tuesday, January 13th ----- 6:00 AM: NFIB Small Business
      Optimism Index for December. 8:30 AM: The Consumer Price Index for
      December from the BLS. The consensus is for 0.3% increase in CPI, and a
      0.3% increase in core CPI.&nbsp; The consensus is for CPI to be up 2.7%
      year-over-year and core CPI to be up 2.7% YoY. 10:00 AM: New Home Sales
      for September and October from the Census Bureau. This graph shows New
      Home Sales since 1963 through August 2025. The dashed line is the sales
      rate for August. The consensus is for 714 thousand SAAR for October. -----
      Wednesday, January 14th ----- 7:00 AM ET: The Mortgage Bankers Association
      (MBA) will release the results for the mortgage purchase applications
      index . This will be two weeks of data. 8:30 AM ET: The Producer Price
      Index for December from the BLS. The consensus is for a 0.3% increase in
      PPI, and a 0.2% increase in core PPI. 8:30 AM: Retail sales for November
      is scheduled to be released. &nbsp; The consensus is for a 0.4% increase
      in retail sales. This graph shows retail sales since 1992.&nbsp; This is
      monthly retail sales and food service, seasonally adjusted (total and
      ex-gasoline). December retail sales for December have not been scheduled
      yet. 10:00 AM: Existing Home Sales for December from the National
      Association of Realtors (NAR). The consensus is for 4.23 million SAAR, up
      from 4.13 million. The graph shows existing home sales from 1994 through
      the report last month. 2:00 PM: the Federal Reserve Beige Book , an
      informal review by the Federal Reserve Banks of current economic
      conditions in their Districts. ----- Thursday, January 15th ----- 8:30 AM:
      The initial weekly unemployment claims report will be released. &nbsp;The
      consensus is for 208K, unchanged from 208K. 8:30 AM: The New York Fed
      Empire State manufacturing survey for January. The consensus is for a
      reading of 1.0, down from -3.9. 8:30 AM: the Philly Fed manufacturing
      survey for January. &nbsp;The consensus is for a reading of -5.0, up from
      -10.2. ----- Friday, January 16th ----- 9:15 AM: The Fed will release
      Industrial Production and Capacity Utilization for December. This graph
      shows industrial production since 1967. The consensus is for a 0.2%
      increase in Industrial Production, and for Capacity Utilization to be
      unchanged at 76.0%. 10:00 AM: The January NAHB homebuilder survey .&nbsp;
      The consensus is for a reading of 40, up from 39 the previous month. Any
      number below 50 indicates that more builders view sales conditions as poor
      than good."
