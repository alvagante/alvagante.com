  - title: Ways to think about token pricing
    url: https://www.ben-evans.com/benedictevans/2026/7/9/ways-to-think-about-token-pricing
    source: Benedict Evans
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=ben-evans.com
    image: https://images.squarespace-cdn.com/content/v1/50363cf324ac8e905e7df861/1788471444333-D99XTWD83NDDBOO0D4VH/Intelligence%2Bvs-%2BCost%2Bper%2BIntelligence%2BIndex%2BTask%2B%288%2BJul%2B%2726%29.png.webp?format=1500w
    summary: AI is in a supply crunch today, but what happens when we come out of
      it? How and where will supply, demand, price, capacity and capex get back
