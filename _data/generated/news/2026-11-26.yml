  - title: Macy's Thanksgiving parade postponed for the first time in the event's
      history
    url: https://www.axios.com/2026/11/25/macys-thanksgiving-parade-2026-balloons-weather
    source: Axios
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=axios.com
    image: https://images.axios.com/WpsVxuu_Uf3T6oqolhQMrOJ-Ils=/0x297:7356x4435/1366x768/2026/11/25/1795627145730.jpg
    summary: "The Macy's Thanksgiving Day Parade has been postponed for the first
      time in the event's history, the retailer confirmed Wednesday. Why it
      matters: Macy's was expected to celebrate its 100th Thanksgiving Day
      Parade with a record 100 inflatables — but an impending nor'easter will
      keep its iconic giant balloons from flying on the holiday. What they're
      saying: \"The safety of our participants and spectators is our top
      priority, and after close consultation with our City and agency partners,
      we have made the decision to move this year's celebration,\" Macy's told
      NBC on Wednesday. \"Thank you to the thousands of volunteers, performers
      and partners who create the magic millions enjoy each year,\" Macy's said.
      The parade has been pushed back to Saturday. NBC will air last year's
      parade during the allocated Thanksgiving time slot. What we're watching:
      It's unclear if any scheduled performers will be unable to participate
      following the postponement, but thousands are involved in the parade each
      year. Saturday's forecast currently shows mostly sunny conditions and a
      high of 55 degrees, according to the National Weather Service . Driving
      the news: A large storm bringing mostly rain and wind to the East Coast
      could disrupt travel plans, holiday parades and more this Thanksgiving,
      per projections from AccuWeather. High winds could also cause widespread
      sporadic power outages across the region, disrupting holiday meal
      preparations. The National Weather Service issued a high wind warning for
      Manhattan on Wednesday morning, with sustained winds of 20 to 30 mph and
      gusts of up to 55 mph forecast for Thursday. How it works: Large balloons
      can't fly when sustained winds exceed 23 mph or wind gusts exceed 34 mph,
      per rules announced by former New York City Mayor Rudy Giuliani in 1998.
      The NYPD has ultimate authority over whether balloons should fly. Worth
      noting: The parade set an all-time viewership record in 2025, with an
      estimated 34.3 million people watching across NBC and the company's
      Peacock streaming service. Flashback: Officials have only grounded all the
      giant character balloons in the parade once before, in 1971, because of
      the weather. In 1997, strong winds pushed a Cat in the Hat balloon into a
      lamppost, critically injuring a spectator. That incident prompted the
      overhaul of the city's safety regulations. In 2019, the parade's giant
      balloons flew close to the ground because of the weather. Balloonfest at
      MetLife Stadium on November 07, 2026 in East Rutherford, New Jersey.
      Photo: Eugene Gologursky/Getty Images for Macy's Inc. Go deeper: Photo
      highlights from Macy's Thanksgiving Day Parade in NYC Editor's note: This
      story has been updated with more information throughout."
