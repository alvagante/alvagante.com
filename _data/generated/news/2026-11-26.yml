  - title: "ESG reporting perceptions from lecturer perspectives: The case of
      Vietnamese Universities"
    url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0363891
    source: PLOS ONE
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=plos.org
    image: https://www.google.com/s2/favicons?sz=64&domain=plos.org
    summary: by Thi Phuong Dung Nguyen, Ha Dac Viet Nguyen, Ha Phuong Nguyen, Thi
      Thanh Hong Pham Higher education institutions play a key role in
      developing Environmental, Social, and Governance (ESG) expertise and
      knowledge. Lecturers are central to translating ESG strategies into
      educational and organizational outcomes, yet their perceptions of ESG
      reporting remain under-explored in Vietnam. This study examines individual
      and institutional factors associated with lecturers’ perceptions of ESG
      reporting, drawing on the Theory of Planned Behavior (TPB), Institutional
      Theory, Stakeholder Theory, and Diffusion of Innovations (DOI) theory.
      Survey data from 437 eligible university lecturers in Vietnam were
      analyzed using PLS-SEM. Results show significant positive associations for
      innovation policies, sustainability action programs, social pressure,
      attitude, perceived usefulness, and knowledge, while subjective norm and
      leadership show no significant direct associations. Academic
      specialization, included as a control variable, is also positively
      associated with Lecturers’ perceptions of ESG reporting. Institutional ESG
      publication significantly negatively associated, suggesting that formal
      disclosure does not necessarily correspond to favorable individual
      perceptions, although the underlying mechanisms remain unclear. Innovation
      policies significantly moderate the relationship between subjective norm
      and lecturers’ perceptions of ESG reporting, while other tested moderating
      effects are not statistically significant. Overall, the findings highlight
      the interplay between individual evaluations and institutional conditions
      in understanding lecturers’ perceptions of ESG reporting in Vietnamese
      higher education.
    category: Science
    tags:
      - science
      - open-access
      - research
      - multidisciplinary
    relevance: 0.6124694231481481
    published_at: 2026-11-25T14:00:00.000Z
