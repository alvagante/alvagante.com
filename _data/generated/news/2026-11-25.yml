    url: https://libertystreeteconomics.newyorkfed.org/2026/11/banking-system-vulnerability-2026-update/
    source: Liberty Street Economics
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=libertystreeteconomics.newyorkfed.org
    image: https://www.google.com/s2/favicons?sz=64&domain=libertystreeteconomics.newyorkfed.org
    summary: As in previous years, we provide in this post an update on the
      vulnerability of the U.S. banking system based on four analytical models
      that capture different aspects of this vulnerability. We use data through
      2026:Q2 to update our analysis and discuss how the vulnerability measures
      have changed since our last update one year ago .
