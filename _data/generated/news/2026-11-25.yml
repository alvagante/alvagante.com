  - title: We Get the Infrastructure We Pay For
    url: https://www.schneier.com/blog/archives/2026/11/we-get-the-infrastructure-we-pay-for.html
    source: Schneier on Security
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=schneier.com
    image: https://www.google.com/s2/favicons?sz=64&domain=schneier.com
    summary: "This essay originally appeared as part of a round table in The Free
      Press entitled \"Is America’s Infrastructure Under Attack?\" Microsoft,
      the FAA, banks, United Airlines, the NSA&#8212;it's been a really bad week
      in cyberspace. But, amazing as it might seem, these are not related. As
      far as we know, they're not the result of cyberattacks. They're not even
      related to AI. (Well, that's mostly true. The NSA will probably never tell
      us what went wrong.) It's really just a series of unfortunate
      coincidences. Our computerized infrastructure is vulnerable and fragile.
      Much of it is old, and has been incrementally patched and upgraded. A
      surprising amount of it is maintained by hobbyists, without any
      recompense. And more and more of it is centralized: the same systems
      affecting many different aspects of our lives and society. In many cases,
      it just barely works. And when it fails, it tends to fail badly..."
    category: Security
    tags:
