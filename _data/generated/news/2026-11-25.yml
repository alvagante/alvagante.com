  - title: Trump talks turkey, and his ballroom, at pardoning event
    url: https://www.axios.com/2026/11/24/trump-turkey-pardon-ballroom
    source: Axios
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=axios.com
    image: https://images.axios.com/ybRvTiQ-ePQKEDhVzu7YyHZw88I=/0x0:4044x2275/1366x768/2026/11/24/1795549907446.jpeg
    summary: "President Trump honored a time-worn Washington tradition Tuesday:
      pardoning poultry — after using the pulpit to praise his White House
      ballroom and deliver a rally-reminiscent speech. The big picture: Freedom
      and Feathers, this year's honored birds, continue a bizarre American
      tradition officially dating back to 1989 — but building on far older
      presidential lore. Driving the news: \"Unfortunately, for 200 years, the
      White House lacked appropriate accommodations to host such distinguished
      guests,\" Trump said at the event, held on the White House's South Lawn.
      He continued, \"I'm pleased to announce that next year we'll be able to
      have a special location right over there in that rather small ballroom
      being built.\" Trump's hotly contested project will be a
      90,000-square-foot addition, far larger than the main White House. \"I've
      heard better,\" he said about the birds' names, though they still earned
      presidential pardons. Both birds will dodge the oven and retire at Texas
      A&M University. State of play: The collective 82 pounds of white-feathered
      flamboyance traveled from West Virginia's Deans Gap Farm for the event.
      Pointing to his large 2024 election win in West Virginia, Trump said
      Tuesday, \"I won it by a lot. I don't know what the hell happened with
      this last election. Somebody, please explain it to me.\" The pair are just
      four months old. Per a White House fact sheet , Freedom's favorite treat
      is Dr. Pepper. Feathers prefers to snack on Golden Delicious apples, which
      — like the turkeys — hail from West Virginia. Between the lines: Trump has
      never shied away from using the event to ruffle feathers. Last year, he
      jabbed at former President Biden and attacked Chicago leadership,
      derailing the focus on his feathered guests by calling Gov. JB Pritzker
      (D) a \"fat slob.\" During his first term, he joked that the turkeys
      trotting before him had were slated to \"appear in Adam Schiff's
      basement,\" a nod to the Democrat who led the 2019 impeachment inquiry
      into Trump. While Trump has taken presidential rhetoric to a new level,
      he's not the first to have stuffed political zingers into the bizarre
      tradition. In 2022, Biden seemingly poked fun at Trump's false claim he'd
      won the 2020 election, saying : \"The votes are in. They've been counted
      and verified. There's no ballot stuffing. There's no fowl play.\" Worth
      noting: PETA called on the White House to end the event, saying presidents
      are \"conned every year into becoming the unpaid spokesperson for factory
      farmers.\" President Tracy Reiman called the idea of retirement for the
      birds \"all squawk, no substance, \" noting fattened-up turkeys often die
      prematurely. Flashback: While George H.W. Bush formalized the pardon in
      1989, the White House's quirky turkey ties stretch back well over a
      century. Abraham Lincoln is frequently credited with sparing the first
      turkey on record at the urging of his son in the 1860s, according to the
      White House Historical Association. Harry Truman welcomed a live turkey
      from the National Turkey Federation in 1947, and the photo-op was hatched.
      But that bird wasn't such a lucky duck — perhaps becoming part of the
      Thanksgiving feast. Since then, the NTF has presented the presidential
      bird. And President John F. Kennedy was gifted a turkey in 1963, but
      decided instead to \"let this one grow.\" The bottom line: Through decades
      of conflict, campaigns and chaos, presidents have come face-to-beak with
      the ubiquitous Thanksgiving birds. Go deeper: The turkey pardon: A quirky
      White House custom"
    category: Geopolitics
    tags:
      - geopolitics
      - news
      - concise
