  - title: GPT 6.2 Astra Solves a Historical Mystery
    url: https://simonwillison.net/2026/Nov/24/astra-historical-mystery/
    source: Simon Willison's Weblog
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=simonwillison.net
    image: https://www.google.com/s2/favicons?sz=64&domain=simonwillison.net
    summary: "GPT 6.2 Astra Solves a Historical Mystery Here's an interesting
      case-study in using GPT-6.2 Astra for historical research, from history
      professor Mark Humphries: With only minimal prompting, GPT-6.2 Astra was
      able to autonomously identify the creator of an anonymous 1808 sketchbook
      held at Yale’s Beinecke Library . It did so extremely quickly (in just 22
      minutes), using publicly available primary and secondary sources. To do
      so, it discovered a little known source in a paper archive, predicted that
      it would prove its hypothesis if examined and, in the end, it did. Not
      only that, but this new source turns out to be a major find on its own
      that will be of significant interest to both Canadian and fur trade
      historians. Here's the digitized sketchbook . Astra found a diary
      reference reference to a visit by the vicomte de Chabot dated five days
      before a date mentioned in the sketchbook at a nearby river, and suggested
      that Chabot's journal of his travels (only available by order from
      Cleveland State University) might confirm that the sketchbook was his
      work. Are historians due for a round of Deep Blue ? Mark thinks it will be
      mild: But if the experience of mathematics is any guide, we can also
      anticipate that sometime next spring or summer we’ll face a sort of crisis
      of confidence as we struggle to understand how to respond to agentic
      systems that can do things human historians cannot. To be fair, that
      crisis will almost certainly be less profound for us than it is for math.
      The problem in mathematics, of course, is that solving hard math problems
      was the whole game. Historians, on the other hand, constantly reinterpret
      the past in light of an evolving present; we don’t chase a single
      universal truth. We also (in the ideal at least) write books and articles
      that are closer to works of philosophy and literature than they are to
      scientific tracts. Humanity is thus something of a requirement for the
      production of historical literature. Tags: history , ai , generative-ai ,
      llms , ai-assisted-search , deep-blue , gpt-6-astra"
    category: AI
    tags:
      - ai
      - llms
      - engineering
      - analysis
