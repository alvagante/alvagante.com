  - title: Harness Engineering for Self-Improvement
    url: https://lilianweng.github.io/posts/2026-07-04-harness/
    source: Lilian Weng's Blog
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=lilianweng.github.io
    image: https://www.google.com/s2/favicons?sz=64&domain=lilianweng.github.io
    summary: "The concept of recursive self-improvement (RSI) dates back to I. J.
      Good (1965) , where he defined an &ldquo;ultraintelligent machine&rdquo;
      as a system that can surpass humans in all intellectual activities and
      design better machines to improve itself. Yudkowsky (2008) used the phrase
      &ldquo;recursive self-improvement&rdquo; for a specific feedback loop: an
      AI uses its current intelligence to improve the cognitive machinery that
      produces its intelligence. This feedback loop in modern AI may indicate
      the model rewriting its own weights directly, or more broadly the model
      improves the training pipeline and the deployment system , which in turn
      enables a better successor model with improved performance across
      economically valuable tasks. The speed of research development in AI has
      been shown to drastically accelerated in frontier labs ( Anthropic ;
      OpenAI )."
    category: AI
