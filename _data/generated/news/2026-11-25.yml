  - title: "Human papillomavirus vaccination coverage among adolescent girls and
      young women living with HIV in low- and middle-income countries: A
      systematic review and meta-analysis"
    url: https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0363748
    source: PLOS ONE
    source_favicon: https://www.google.com/s2/favicons?sz=64&domain=plos.org
    image: https://www.google.com/s2/favicons?sz=64&domain=plos.org
    summary: "by Ifeyinwa Lilian Ezenwosu, John Olajide Olawepo, Jane Nnedinma
      Ohaekweiro, Peter Ezeogo Ihere, Emeka John Aneke, Justus Uchenna Onu,
      Oluchukwu Perpetual Okeke, Olajide Odunayo Sobande Introduction Human
      Papilloma Virus (HPV)-attributable cancers disproportionately affect
      adolescent girls and young women living with HIV (AGYWLHIV) in low- and
      middle-income countries (LMICs), yet HPV vaccination coverage in this
      subpopulation remains suboptimal. This systematic review and meta-analysis
      estimated the pooled prevalence of HPV vaccination coverage among AGYWLHIV
      in LMICs. Methods A systematic search was conducted in PubMed, Scopus,
      Cumulative Index to Nursing and Allied Health Literature (CINAHL), and Web
      of Science for observational studies published between January 2014 and
      December 2025. A random-effects meta-analysis was used to estimate the
      pooled prevalence of HPV vaccination coverage. Subgroup analyses by age
      group and vaccine type were conducted, while HPV vaccination delivery
      platforms were summarised descriptively. Publication bias and sensitivity
      analyses were also performed, and statistical heterogeneity was evaluated
      using the I² statistic. Results A total of 8 studies involving 1,059
      AGYWLHIV were included in the meta-analysis. The pooled HPV vaccination
      coverage among AGYWLHIV in LMICs was 28.6% (95% CI: 20.3%–38.7%) based on
      a random-effects model, with substantial heterogeneity across studies (I²
      = 87.0%, p Conclusion The available evidence from studies conducted in
      LMICs indicates low HPV vaccination coverage among AGYWLHIV. Integrating
      HPV vaccination into routine HIV care may represent a potentially useful
      strategy to improve access and reduce missed vaccination opportunities
      among AGYWLHIV and should be further evaluated alongside broader efforts
      supported by strong political commitment and multisectoral collaboration.
      PROSPERO Number: CRD420251068971"
