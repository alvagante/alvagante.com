title: Alvagante
tagline: Infrastructure, AI, and the wider world — curated daily.
description: Curated links, AI engineering notes, and daily AI-assisted news digests across AI, security, IT, technology, science, and geopolitics.
url: "https://alvagante.com"
baseurl: ""
logo: /assets/img/alvagante-logo.png
header_logo: /assets/img/alvagante-logo-horizontal.png
og_image: /assets/img/alvagante-logo.png
favicon: /assets/img/alvagante-favicon.png
timezone: Europe/Rome
lang: en
author:
  name: Alessandro Franceschi
  url: https://alvagante.com/about/
  same_as:
    - https://github.com/alvagante/
    - https://www.linkedin.com/in/alessandrofranceschi/
    - https://x.com/alvagante
social:
  twitter: alvagante
company:
  name: Lab42 Srl
  vat_id: IT03677180121
  email: info@lab42.it
markdown: kramdown
permalink: pretty

exclude:
  - AGENTS.md
  - CLAUDE.md
  - .bundle/
  - .dockerignore
  - .github/
  - .jekyll-cache/
  - .jekyll-metadata
  - .sass-cache/
  - .swamp/
  - .swamp-sources.yaml
  - .agents/
  - .claude/
  - docker-compose.yml
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - extensions/
  - manifest.yaml
  - models/
  - README.md
  - vendor/
  - vaults/
  - workflows/

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Collections for AI engineering section
collections:
  ai-blog:
    output: true
    permalink: /ai-engineer/blog/:path/
  ai-notebooks:
    output: true
    permalink: /ai-engineer/notebooks/:path/
  ai-slides:
    output: true
    permalink: /ai-engineer/slides/:path/
  ai-cheat-sheets:
    output: true
    permalink: /ai-engineer/cheat-sheets/:path/
  ai-infographics:
    output: true
    permalink: /ai-engineer/infographics/:path/
  ai-social-posts:
    output: true
    permalink: /ai-engineer/social/:path/
