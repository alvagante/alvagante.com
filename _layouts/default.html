<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ site.favicon | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
        <img src="{{ site.header_logo | default: site.logo | relative_url }}" alt="{{ site.title }} logo">
      </a>
      <nav aria-label="Primary">
        <a href="{{ '/links/' | relative_url }}">Links</a>
        <a href="{{ '/news/' | relative_url }}">News</a>
        {% for topic in site.data.link_topics %}
          <a href="{{ '/' | append: topic.slug | append: '/' | relative_url }}">{{ topic.title }}</a>
        {% endfor %}
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      <div>
        <span>{{ site.time | date: "%Y" }} {{ site.company.name }} · VAT {{ site.company.vat_id }}</span>
        <span>Static data, daily automation.</span>
      </div>
      <nav class="legal-nav" aria-label="Legal">
        <a href="{{ '/legal-notice/' | relative_url }}">Legal Notice</a>
        <a href="{{ '/privacy-policy/' | relative_url }}">Privacy</a>
        <a href="{{ '/cookie-policy/' | relative_url }}">Cookies</a>
        <a href="{{ '/terms/' | relative_url }}">Terms</a>
      </nav>
    </footer>
    <script src="{{ '/assets/js/filters.js' | relative_url }}" defer></script>
  </body>
</html>
