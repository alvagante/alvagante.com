<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">Alvagante</a>
      <nav aria-label="Primary">
        <a href="{{ '/links/' | relative_url }}">Links</a>
        <a href="{{ '/news/' | relative_url }}">News</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>{{ site.time | date: "%Y" }} Alvagante</span>
      <span>Static data, daily automation.</span>
    </footer>
    <script src="{{ '/assets/js/filters.js' | relative_url }}" defer></script>
  </body>
</html>
